name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # On a tag push github.ref_name is the tag; on a manual run it is the branch,
      # so the explicit input has to win.
      VERSION: ${{ inputs.tag || github.ref_name }}
      # The secrets context cannot be read from a step-level `if`, so it is folded
      # into a job-level env var that steps can test.
      HAS_KEYSTORE: ${{ secrets.QUI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Optional. Without these secrets the release APK is signed with the Android
      # debug key instead: it still installs, but it is not a key you control, so
      # switching to a real key later forces users to uninstall first.
      # See README for how to set them up.
      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.QUI_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APK
        env:
          QUI_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          QUI_KEYSTORE_PASSWORD: ${{ secrets.QUI_KEYSTORE_PASSWORD }}
          QUI_KEY_ALIAS: ${{ secrets.QUI_KEY_ALIAS }}
          QUI_KEY_PASSWORD: ${{ secrets.QUI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Report which key signed the APK
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/qui-android-${VERSION}.apk"
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
