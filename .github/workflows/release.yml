name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # On a tag push github.ref_name is the tag; on a manual run it is the branch,
      # so the explicit input has to win.
      VERSION: ${{ inputs.tag || github.ref_name }}
      # The secrets context cannot be read from a step-level `if`, so it is folded
      # into a job-level env var that steps can test.
      HAS_KEYSTORE: ${{ secrets.QUI_KEYSTORE_BASE64 != '' }}
    steps:
      # Full history so the release-notes fallback can diff against the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Optional. Without these secrets the release APK is signed with the Android
      # debug key instead: it still installs, but it is not a key you control, so
      # switching to a real key later forces users to uninstall first.
      # See README for how to set them up.
      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.QUI_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APK
        env:
          QUI_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          QUI_KEYSTORE_PASSWORD: ${{ secrets.QUI_KEYSTORE_PASSWORD }}
          QUI_KEY_ALIAS: ${{ secrets.QUI_KEY_ALIAS }}
          QUI_KEY_PASSWORD: ${{ secrets.QUI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Report which key signed the APK
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/qui-android-${VERSION}.apk"
          ls -l dist

      # GitHub's own generator lists merged pull requests, and this repository has
      # none, so it produces an empty body. The CHANGELOG section for the tag is the
      # release notes instead — the same text the app shows in its update dialog.
      # The "## 简体中文" / "## English" headings are load-bearing: the app splits the
      # release body on them to show one language in its update dialog.
      - name: Extract release notes
        run: |
          version="${VERSION#v}"

          section() {
            awk -v v="$version" '
              $0 ~ "^## " v "$" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$1"
          }

          section CHANGELOG.md > dist/notes-en.md
          section CHANGELOG.zh-CN.md > dist/notes-zh.md

          : > dist/notes.md
          if [ -s dist/notes-zh.md ]; then
            printf '## 简体中文\n' >> dist/notes.md
            cat dist/notes-zh.md >> dist/notes.md
          fi
          if [ -s dist/notes-en.md ]; then
            printf '## English\n' >> dist/notes.md
            cat dist/notes-en.md >> dist/notes.md
          fi

          if [ ! -s dist/notes.md ]; then
            echo "::warning::No CHANGELOG section for $version; falling back to commits"
            previous=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
            if [ -n "$previous" ]; then
              git log --pretty='- %s' "$previous..$VERSION" > dist/notes.md
            else
              git log --pretty='- %s' -20 "$VERSION" > dist/notes.md
            fi
          fi
          rm -f dist/notes-en.md dist/notes-zh.md
          cat dist/notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*.apk
          body_path: dist/notes.md
          fail_on_unmatched_files: true

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
