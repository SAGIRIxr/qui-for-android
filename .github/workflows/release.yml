name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # On a tag push github.ref_name is the tag; on a manual run it is the branch,
      # so the explicit input has to win.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      # Full history so the release-notes fallback can diff against the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release version and notes
        run: python tools/check_release.py --tag "$VERSION"

      - name: Require release signing credentials
        env:
          KEYSTORE: ${{ secrets.QUI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QUI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QUI_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.QUI_SIGNING_CERT_SHA256 }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing credential: $name"
              exit 1
            fi
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Check translations and lint
        run: |
          python tools/check_translations.py
          ./gradlew lintDebug --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE: ${{ secrets.QUI_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APK
        env:
          QUI_KEYSTORE_FILE: ${{ format('{0}/release.jks', runner.temp) }}
          QUI_REQUIRE_RELEASE_SIGNING: 'true'
          QUI_KEYSTORE_PASSWORD: ${{ secrets.QUI_KEYSTORE_PASSWORD }}
          QUI_KEY_ALIAS: ${{ secrets.QUI_KEY_ALIAS }}
          QUI_KEY_PASSWORD: ${{ secrets.QUI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release signing certificate
        env:
          EXPECTED_SHA256: ${{ secrets.QUI_SIGNING_CERT_SHA256 }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/certificate.txt"
          actual=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt" | head -1)
          test "$actual" = "$EXPECTED_SHA256" || { echo '::error::Signing certificate mismatch'; exit 1; }

      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/qui-android-${VERSION}.apk"
          ls -l dist

      # GitHub's own generator lists merged pull requests, and this repository has
      # none, so it produces an empty body. The CHANGELOG section for the tag is the
      # release notes instead — the same text the app shows in its update dialog.
      # The "## 简体中文" / "## English" headings are load-bearing: the app splits the
      # release body on them to show one language in its update dialog.
      - name: Extract release notes
        run: |
          version="${VERSION#v}"

          section() {
            awk -v v="$version" '
              $0 ~ "^## " v "$" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$1"
          }

          section CHANGELOG.md > dist/notes-en.md
          section CHANGELOG.zh-CN.md > dist/notes-zh.md

          : > dist/notes.md
          if [ -s dist/notes-zh.md ]; then
            printf '## 简体中文\n' >> dist/notes.md
            cat dist/notes-zh.md >> dist/notes.md
          fi
          if [ -s dist/notes-en.md ]; then
            printf '## English\n' >> dist/notes.md
            cat dist/notes-en.md >> dist/notes.md
          fi

          if [ ! -s dist/notes.md ]; then
            echo "::warning::No CHANGELOG section for $version; falling back to commits"
            previous=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
            if [ -n "$previous" ]; then
              git log --pretty='- %s' "$previous..$VERSION" > dist/notes.md
            else
              git log --pretty='- %s' -20 "$VERSION" > dist/notes.md
            fi
          fi
          rm -f dist/notes-en.md dist/notes-zh.md
          cat dist/notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*.apk
          body_path: dist/notes.md
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
